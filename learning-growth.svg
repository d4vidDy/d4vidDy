<svg xmlns="http://www.w3.org/2000/svg" width="760" height="328" viewBox="0 0 760 328" role="img" aria-labelledby="title desc">
  <title id="title">Certificaciones y formación continua</title>
  <desc id="desc">Cursos y credenciales mencionados en el CV, agrupados por área y ordenados de menor a mayor: formación complementaria 2, datos e inteligencia artificial 4, nube y seguridad 5, web y móvil 5, arquitectura y backend 6, QA y automatización 12.</desc>
  <defs><linearGradient id="bar" x2="1"><stop stop-color="#737373"/><stop offset="1" stop-color="#F2F2F2"/></linearGradient></defs>
  <rect x="1" y="1" width="758" height="326" rx="18" fill="#080808" stroke="#303030"/>
  <text x="28" y="36" fill="#F5F5F5" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="600">Crecimiento por área de formación</text>
  <text x="28" y="59" fill="#A3A3A3" font-family="system-ui,Segoe UI,sans-serif" font-size="13">Cursos y credenciales registrados en el CV · orden ascendente</text>
  <g font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#E5E5E5">
    <text x="28" y="91">Complementaria</text><text x="718" y="91" text-anchor="end">2</text>
    <text x="28" y="132">Datos e IA</text><text x="718" y="132" text-anchor="end">4</text>
    <text x="28" y="173">Cloud y seguridad</text><text x="718" y="173" text-anchor="end">5</text>
    <text x="28" y="214">Web y móvil</text><text x="718" y="214" text-anchor="end">5</text>
    <text x="28" y="255">Arquitectura y backend</text><text x="718" y="255" text-anchor="end">6</text>
    <text x="28" y="296">QA y automatización</text><text x="718" y="296" text-anchor="end">12</text>
  </g>
  <g fill="#292929"><rect x="190" y="80" width="471" height="11" rx="5.5"/><rect x="190" y="121" width="471" height="11" rx="5.5"/><rect x="190" y="162" width="471" height="11" rx="5.5"/><rect x="190" y="203" width="471" height="11" rx="5.5"/><rect x="190" y="244" width="471" height="11" rx="5.5"/><rect x="190" y="285" width="471" height="11" rx="5.5"/></g>
  <g fill="url(#bar)"><rect x="190" y="80" width="79" height="11" rx="5.5"/><rect x="190" y="121" width="157" height="11" rx="5.5"/><rect x="190" y="162" width="196" height="11" rx="5.5"/><rect x="190" y="203" width="196" height="11" rx="5.5"/><rect x="190" y="244" width="236" height="11" rx="5.5"/><rect x="190" y="285" width="471" height="11" rx="5.5"/></g>

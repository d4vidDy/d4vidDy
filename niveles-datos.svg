<svg xmlns="http://www.w3.org/2000/svg" width="576" height="119" viewBox="0 0 560 116" role="img" aria-labelledby="title description">
  <title id="title">Autoevaluación en plataformas de datos</title>
  <desc id="description">Databricks: 60 %. Snowflake: 45 %. Las barras usan una escala de 0 a 100 %.</desc>
  <defs>
    <linearGradient id="fill" x2="100%" y2="0%">
      <stop stop-color="#737373"/>
      <stop offset="1" stop-color="#F2F2F2"/>
    </linearGradient>
  </defs>
  <rect x=".5" y=".5" width="559" height="115" rx="13.5" fill="#080808" stroke="#303030"/>
  <path d="M22 58H538" stroke="#292929"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#E5E5E5">
    <text x="22" y="39">Databricks</text>
    <text x="22" y="88">Snowflake</text>
    <text x="538" y="39" text-anchor="end" fill="#F2F2F2">60 %</text>
    <text x="538" y="88" text-anchor="end" fill="#F2F2F2">45 %</text>
  </g>
  <g fill="#292929">
    <rect x="146" y="29" width="320" height="10" rx="5"/>
    <rect x="146" y="78" width="320" height="10" rx="5"/>
  </g>
  <g fill="url(#fill)">
    <rect x="146" y="29" width="192" height="10" rx="5"/>
    <rect x="146" y="78" width="144" height="10" rx="5"/>
  </g>
</svg>
